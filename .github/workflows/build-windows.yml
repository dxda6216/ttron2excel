name: Build Windows EXE

on:
  workflow_dispatch:        
  push:
    tags: ["v*"]            

permissions:
  contents: write           

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --windowed --name TTron2Excel --hidden-import openpyxl --hidden-import matplotlib.backends.backend_tkagg ttron2excel_app.py

      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path dist/TTron2Excel -DestinationPath TTron2Excel-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TTron2Excel-windows
          path: TTron2Excel-windows.zip

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TTron2Excel-windows.zip
