name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]            # e.g. v1.0.0 -> also publishes a GitHub Release
  pull_request:
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write           # needed only to create the Release for a tag

jobs:
  build:
    runs-on: windows-latest
    env:
      # The Windows runner's console uses cp1252, which cannot print characters
      # such as the arrow in the app title; make Python use UTF-8 everywhere.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Check that the program loads
        run: python -c "import ttron2excel_app as app; print('Loaded OK:', ascii(app.APP_TITLE))"

      - name: Build the EXE
        run: pyinstaller --noconfirm --clean ttron2excel.spec

      - name: Show the result
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, @{n='Size (MB)'; e={[math]::Round($_.Length / 1MB, 1)}}

      - name: Upload the EXE (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TTRON2Excel-windows
          path: dist/TTRON2Excel.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TTRON2Excel.exe
          generate_release_notes: true
