name: Build Windows exe

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:      # manual run from the Actions tab

permissions:
  contents: write         # needed to attach the exe to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check that the app imports (tkinter included)
        run: python -c "import ttron2excel_app; print('import OK')"

      - name: Build exe with PyInstaller
        run: >
          pyinstaller ttron2excel_app.py
          --name ttron2excel
          --onefile
          --windowed
          --noconfirm
          --clean
          --hidden-import matplotlib.backends.backend_tkagg
          --hidden-import matplotlib.backends.backend_pdf
          --hidden-import openpyxl
          --exclude-module IPython
          --exclude-module pytest

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ttron2excel.exe -DestinationPath dist\ttron2excel-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttron2excel-windows
          path: |
            dist/ttron2excel.exe
            dist/ttron2excel-windows.zip

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ttron2excel.exe
            dist/ttron2excel-windows.zip
          generate_release_notes: true
